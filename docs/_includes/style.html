<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .hanzi { font-size: 32px; font-weight: bold; line-height: 1.1; }

  .number { font-size: 13px; opacity: 0.8; }
  .bottom button { height: 60px; flex-direction: row; gap: 10px; font-size: 20px; font-weight: bold; background: #0f3460; color: #fff; }

  .back { position: fixed; top: 20px; left: 20px; background: #333; color: #fff; padding: 10px 15px; text-decoration: none; border-radius: 5px; }
  .back:hover { background: #555; }
</style>
